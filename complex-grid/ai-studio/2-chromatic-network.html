<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Complex Grid: Chromatic Network</title>
    <style>
        :root { --bg: #010103; --ui: #0c0c10; --active: #00ffff; --text: #eee; }
        body.light-mode { --bg: #f0f0f5; --land: #fff; --road: #000; --text: #222; }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        #controls { background: var(--ui); padding: 10px 20px; border-bottom: 2px solid #000; display: flex; gap: 20px; align-items: center; z-index: 100; flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        #tabs { display: flex; background: #000; padding: 2px; border-radius: 4px; margin-left: auto; border: 1px solid #333; }
        .tab-btn { padding: 6px 15px; font-size: 10px; text-transform: uppercase; color: #555; border: none; background: none; cursor: pointer; border-radius: 2px; font-family: inherit; }
        .tab-btn.active { background: #222; color: var(--active); font-weight: bold; }
        
        .slider-wrap { display: flex; flex-direction: column; min-width: 150px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--active); }
        
        #view-stack { flex-grow: 1; position: relative; overflow: hidden; }
        .view-pane { position: absolute; inset: 0; display: none; overflow: auto; background: var(--bg); }
        .view-pane.active { display: block; }

        svg { width: 100%; height: 100%; display: block; }
        .road-tile { stroke: none; }

        /* TOPOLOGY TREE */
        #tree-container { padding: 40px; font-size: 12px; line-height: 1.6; color: #888; }
        .tree-node { margin-bottom: 8px; border-left: 1px solid #333; padding-left: 15px; }
        .rank-tag { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; text-transform: uppercase; margin-right: 8px; }

        button { background: #1a1a20; color: #fff; border: 1px solid #333; padding: 5px 12px; cursor: pointer; border-radius: 3px; font-size: 10px; font-family: inherit; }
        button:hover { border-color: var(--active); }
    </style>
</head>
<body>

<div id="controls">
    <div class="slider-wrap">
        <span style="font-size: 8px; color:#777; letter-spacing:1px;">GROWTH CHRONOLOGY</span>
        <div style="display:flex; align-items:center; gap:10px;">
            <input type="range" id="stepSlider" min="0" max="1000" value="200">
            <span id="stepVal" style="font-size: 11px; color: var(--active); min-width:30px;">0</span>
        </div>
    </div>

    <div style="display:flex; gap:15px; align-items:center;">
        <input type="text" id="seed" value="nautilus" style="width:70px; background:#000; color:#fff; border:1px solid #333; font-size:11px; padding:4px;">
        <button id="toggleReverse">Invert Theme</button>
        <button id="resetCam">Reset Cam</button>
    </div>

    <div id="tabs">
        <button class="tab-btn active" data-view="svg">Grid Map</button>
        <button class="tab-btn" data-view="tree">Topology</button>
    </div>
</div>

<div id="view-stack">
    <div id="svg-pane" class="view-pane active">
        <div id="svg-container" style="width:100%; height:100%; cursor:grab">
            <svg id="citySvg" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
    </div>
    <div id="tree-pane" class="view-pane">
        <div id="tree-container"></div>
    </div>
</div>

<script>
/** 1. ENGINE **/
const BASE_ROAD_WIDTHS = [5.0, 3.0, 1.5, 0.75, 0.3, 0.15];

function createRNG(s) {
    let h = 0; for(let i=0; i<s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
    let state = h |= 0;
    return function() {
        let t = state += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

// Color Logic based on Rank (Depth)
function getRankColor(depth) {
    // Rank 0: Blue (Macro)
    // Rank 5: Red (Micro)
    const hues = [200, 170, 140, 45, 20, 0]; 
    const h = hues[Math.min(depth, hues.length - 1)];
    return `hsl(${h}, 80%, 50%)`;
}

class RoadTile {
    constructor(id, x, y, w, h, wave, depth) {
        this.id = id; this.x = x; this.y = y; this.w = w; this.h = h;
        this.wave = wave; this.depth = depth;
        this.color = getRankColor(depth);
    }
}

class ComplexEngine {
    constructor(seed) {
        this.rng = createRNG(seed);
        this.tiles = new Map();
        this.metabolismStack = [];
        this.waveCount = 0;
        this.plan = { x1: -16, y1: -16, x2: 16, y2: 16 };
        this.spawnBlock(-16, -16, 32, 32, 0, 0);
    }

    spawnBlock(x, y, w, h, depth, wave) {
        const waveMult = 1 + (wave * 0.15);
        const rw = BASE_ROAD_WIDTHS[Math.min(depth, 5)] * waveMult;
        const half = rw / 2;

        const prefix = `w${wave}d${depth}_${Math.floor(x)}_${Math.floor(y)}`;
        const t = (id, tx, ty, tw, th) => new RoadTile(`${prefix}_${id}`, tx, ty, tw, th, wave, depth);

        const newTiles = [
            t('N', x + half, y, w - rw, half), t('S', x + half, y + h - half, w - rw, half),
            t('W', x, y + half, half, h - rw), t('E', x + w - half, y + half, half, h - rw),
            t('NW', x, y, half, half), t('NE', x + w - half, y, half, half),
            t('SW', x, y + h - half, half, half), t('SE', x + w - half, y + h - half, half, half)
        ];

        newTiles.forEach(tile => this.tiles.set(tile.id, tile));
        return { x: x + half, y: y + half, w: w - rw, h: h - rw };
    }

    step() {
        if (this.metabolismStack.length > 0) {
            let item = this.metabolismStack.pop();
            let area = item.area;
            if (item.depth > 1 && this.rng() < 0.12) return;
            if (area.w > 12 || area.h > 12) {
                let split = 0.45 + this.rng() * 0.1;
                let nextD = item.depth + 1;
                let c1, c2;
                if (area.w >= area.h) {
                    c1 = { x: area.x, y: area.y, w: area.w * split, h: area.h };
                    c2 = { x: area.x + area.w * split, y: area.y, w: area.w * (1 - split), h: area.h };
                } else {
                    c1 = { x: area.x, y: area.y, w: area.w, h: area.h * split };
                    c2 = { x: area.x, y: area.y + area.h * split, w: area.w, h: area.h * (1 - split) };
                }
                const a1 = this.spawnBlock(c1.x, c1.y, c1.w, c1.h, nextD, item.wave);
                const a2 = this.spawnBlock(c2.x, c2.y, c2.w, c2.h, nextD, item.wave);
                if ((c1.x**2 + c1.y**2) > (c2.x**2 + c2.y**2)) {
                    this.metabolismStack.push({ area: a1, depth: nextD, wave: item.wave });
                    this.metabolismStack.push({ area: a2, depth: nextD, wave: item.wave });
                } else {
                    this.metabolismStack.push({ area: a2, depth: nextD, wave: item.wave });
                    this.metabolismStack.push({ area: a1, depth: nextD, wave: item.wave });
                }
            }
            return;
        }

        this.waveCount++;
        let p = this.plan, w = p.x2 - p.x1, h = p.y2 - p.y1;
        let side = (w >= h) ? (this.rng() > 0.5 ? 'T' : 'B') : (this.rng() > 0.5 ? 'L' : 'R');
        let phi = 0.618, slab;
        if (side === 'L' || side === 'R') {
            let pr = h * phi;
            slab = { x: (side === 'L' ? p.x1 - pr : p.x2), y: p.y1, w: pr, h: h };
            if (side === 'L') p.x1 -= pr; else p.x2 += pr;
        } else {
            let pr = w * phi;
            slab = { x: p.x1, y: (side === 'T' ? p.y1 - pr : p.y2), w: w, h: pr };
            if (side === 'T') p.y1 -= pr; else p.y2 += pr;
        }
        const core = this.spawnBlock(slab.x, slab.y, slab.w, slab.h, 1, this.waveCount);
        this.metabolismStack.push({ area: core, depth: 1, wave: this.waveCount });
    }
    generate(n) { for(let i=0; i<n; i++) this.step(); }
}

/** 2. RENDERER **/
const svg = document.getElementById('citySvg'), slider = document.getElementById('stepSlider');
const treeCont = document.getElementById('tree-container'), sc = document.getElementById('svg-container');

function render() {
    const steps = Math.floor(6000 * Math.pow(slider.value / 1000, 2.5));
    document.getElementById('stepVal').innerText = steps;
    const engine = new ComplexEngine(document.getElementById('seed').value);
    engine.generate(steps);

    // SVG Geometry
    const p = engine.plan;
    const maxR = Math.max(Math.abs(p.x1), Math.abs(p.x2), Math.abs(p.y1), Math.abs(p.y2));
    const size = maxR * 2.3;
    svg.setAttribute('viewBox', `${-size/2} ${-size/2} ${size} ${size}`);
    svg.innerHTML = '';
    const frag = document.createDocumentFragment();
    engine.tiles.forEach(t => {
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute('x', t.x); r.setAttribute('y', t.y);
        r.setAttribute('width', t.w); r.setAttribute('height', t.h);
        r.setAttribute('fill', t.color);
        frag.appendChild(r);
    });
    svg.appendChild(frag);

    // Tree Rendering (Topology)
    treeCont.innerHTML = '<h2>Urban Topology Registry</h2>';
    const sorted = Array.from(engine.tiles.values()).sort((a,b) => a.depth - b.depth).slice(0, 150);
    sorted.forEach(t => {
        const div = document.createElement('div');
        div.className = 'tree-node';
        div.innerHTML = `<span class="rank-tag" style="background:${t.color}; color:#000">Rank ${t.depth}</span> <strong>${t.id}</strong><br><span class="node-ref">Wave ${t.wave} | W:${t.w.toFixed(2)} H:${t.h.toFixed(2)}</span>`;
        treeCont.appendChild(div);
    });
}

/** 3. INTERACTION & TAB FIX **/
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
        // Clear all active states
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
        
        // Activate current
        btn.classList.add('active');
        const targetId = btn.getAttribute('data-view') + '-pane';
        document.getElementById(targetId).classList.add('active');
        
        // Special case: Ensure render happens when switching to see fresh data
        if(btn.getAttribute('data-view') === 'tree') render();
    };
});

document.getElementById('toggleReverse').onclick = () => document.body.classList.toggle('reverse-mode');
document.getElementById('resetCam').onclick = render;

// Touch/Pan Logic
let isD = false, lastP = {x:0, y:0};
sc.onpointerdown = e => { isD = true; lastP = {x:e.clientX, y:e.clientY}; };
window.onpointermove = e => {
    if (!isD) return;
    const vb = svg.viewBox.baseVal;
    const s = vb.width / sc.clientWidth;
    vb.x -= (e.clientX - lastP.x) * s;
    vb.y -= (e.clientY - lastP.y) * s;
    lastP = {x:e.clientX, y:e.clientY};
};
window.onpointerup = () => isD = false;

document.querySelectorAll('input').forEach(i => i.oninput = render);
render();
</script>
</body>
</html>
